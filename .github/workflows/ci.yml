name: CI

# Temporarily disabled while GitHub Actions is blocked by account billing.
# To re-enable, restore push/pull_request triggers and remove the job-level 'if: false'.
# The commands below are intentionally preserved for later use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (TypeScript + Vite)
        run: npm run build
